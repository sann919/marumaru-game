<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#163b1f;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}

.mon.found{display:none}.mon.catching{pointer-events:none}.mon.catching img{animation:monsterCatch .52s cubic-bezier(.2,.8,.25,1) forwards}@keyframes monsterCatch{0%{transform:scale(1);opacity:1}35%{transform:scale(1.12);opacity:1}100%{transform:translateY(-24%) scale(.68);opacity:0}}

#mon-a{left:6.8%; top:35.8%; width:17.0%; height:24.5%}
#mon-ka{left:35.8%; top:35.8%; width:15.5%; height:22.5%}
#mon-i{left:70.8%; top:27.5%; width:18.0%; height:25.5%}

@keyframes sparkFly{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.35);opacity:0}}
#message{position:absolute; left:50%; top:49%; transform:translate(-50%,-50%) scale(.85); width:min(80%,520px); background:#fff7df; border:6px solid #d48d31; border-radius:26px; text-align:center; padding:18px 20px; z-index:40; display:none; box-shadow:0 12px 28px rgba(0,0,0,.25)}

@media (max-width:640px){#game{width:100vw}}

/* Keep interactive text in opaque panels so the illustration lettering cannot overlap it. */
#instruction{position:absolute;left:68.6%;top:3.8%;width:15.8%;height:14.9%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff4df;color:#492b14;border-radius:14%;z-index:13;font-weight:900;line-height:1.15;container-type:inline-size}
#guideLead{font-size:13cqw}#guideEnd{font-size:12cqw;white-space:nowrap}
#targetWord{position:static;width:100%;font-size:29cqw;line-height:1.25;color:#d34532;text-shadow:none}
#repeatGuide{position:absolute;left:83.3%;top:7.5%;width:6%;height:9%;border:0;background:transparent;z-index:15;cursor:pointer}
#steps{left:34.9%;top:86.2%;bottom:auto;width:30.4%;height:9.9%;padding:0 2%;background:#ffe4af;border-radius:14px;font-size:clamp(12px,3.5vw,34px);gap:8%;}
.step{opacity:1;display:flex;align-items:center;justify-content:center;width:27%;aspect-ratio:1;border:2px dashed #b69360;border-radius:50%;color:#b69360;line-height:1}
.step.done{color:#714624;background:#ffcf68;border-style:solid}
.mon:disabled{cursor:default}.mon:focus-visible,#restart:focus-visible,#repeatGuide:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media(max-width:640px){#message{padding:8px;border-width:3px}#message .big{font-size:38px}#message .txt{font-size:20px}#again{font-size:16px;margin-top:6px;padding:8px 16px}}
#instruction{overflow:hidden}
#instruction span{flex-shrink:0}
#instruction.complete #targetWord{font-size:17cqw;white-space:nowrap}

/* Three letters merge, then a sunburst reveals the ice cream. */
#message{inset:0;left:0;top:0;width:100%;height:100%;transform:none;border:0;border-radius:0;padding:0;background:rgba(12,39,25,.64);box-shadow:none;overflow:hidden;isolation:isolate;container-type:inline-size}
#message.show{display:block;animation:none}
#restart{z-index:45}
.fusion-letter{position:absolute;left:50%;top:46%;width:10%;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:#fff1be;border:3px solid #ffc95e;color:#7c4620;font-size:6cqw;font-weight:900;box-shadow:0 0 24px #ffe9a9;opacity:0;z-index:3;pointer-events:none}
#message.show .fusion-letter{animation:letterFusion 1.7s cubic-bezier(.45,0,.25,1) both}
@keyframes letterFusion{0%{opacity:0;transform:translate(calc(-50% + var(--from-x)),calc(-50% + var(--from-y))) scale(.65)}12%{opacity:1;transform:translate(calc(-50% + var(--from-x)),calc(-50% + var(--from-y))) scale(1)}52%{opacity:1;transform:translate(calc(-50% + var(--orbit-x)),calc(-50% + var(--orbit-y))) rotate(var(--tilt)) scale(1.1)}83%{opacity:1;transform:translate(-50%,-50%) rotate(0) scale(.65)}100%{opacity:0;transform:translate(-50%,-50%) scale(.05)}}
.reward-halo{position:absolute;left:50%;top:46%;width:76%;aspect-ratio:1;transform:translate(-50%,-50%);opacity:0;pointer-events:none;background:radial-gradient(circle,#fff9dc 0%,#ffdc7c99 18%,#ffc34333 42%,transparent 65%)}
.reward-halo::before{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,#ffe28b99 0deg 10deg,transparent 10deg 26deg);mask-image:radial-gradient(circle,#000 5%,#0009 35%,transparent 69%);animation:haloTurn 18s linear infinite;animation-play-state:paused}
@keyframes haloTurn{to{transform:rotate(360deg)}}
#message.revealed .reward-halo{animation:haloAppear .85s ease-out forwards}
#message.revealed .reward-halo::before{animation-play-state:running}
@keyframes haloAppear{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#rewardIce{position:absolute;left:50%;top:46%;font-size:22cqw;line-height:1;transform:translate(-50%,-50%) scale(0);opacity:0;filter:drop-shadow(0 0 18px #fff2a8);z-index:4}
#message.revealed #rewardIce{animation:iceAppear .95s cubic-bezier(.2,.9,.25,1.25) forwards}
@keyframes iceAppear{0%{opacity:0;transform:translate(-50%,-50%) scale(.05) rotate(-16deg)}65%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(5deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
.reward-star{position:absolute;left:50%;top:46%;font-size:4cqw;color:#fff3ad;opacity:0;z-index:5;pointer-events:none;text-shadow:0 0 12px #fff}
#message.revealed .reward-star{animation:rewardStar 1.4s ease-out both}
@keyframes rewardStar{0%{opacity:0;transform:translate(-50%,-50%) scale(0)}25%{opacity:1}100%{opacity:.85;transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) rotate(100deg) scale(1)}}
#message .txt{position:absolute;top:69%;left:0;width:100%;font-size:4cqw;line-height:1.3;color:#fff4ca;text-shadow:0 2px 3px #604119;opacity:0;margin:0;transform:translateY(8px)}
#message.ready .txt{opacity:1;transform:translateY(0);transition:opacity .4s,transform .4s}
#again{position:absolute;top:86%;left:50%;transform:translateX(-50%);font-size:2.5cqw;padding:1.2cqw 3cqw;margin:0;white-space:nowrap;visibility:hidden}
#message.ready #again{visibility:visible}
@media(prefers-reduced-motion:reduce){#message.show .fusion-letter{animation:none;opacity:0}#message.revealed .reward-halo,#message.revealed #rewardIce,#message.revealed .reward-star{animation-duration:.01s}#message.revealed .reward-halo::before{animation:none}#message.ready .txt{transition:none}}


/* Stage-driven labels and reusable monster artwork. */
#game{container-type:inline-size}
#stageSign{position:absolute;left:37.3%;top:3%;width:25%;height:9.2%;z-index:14;display:flex;align-items:center;justify-content:space-between;gap:2%;background:#ffe6af;border-radius:12px;padding:0 1%;color:#4b2c17;font-weight:900}
#stageNumber{font-size:1.65cqw;line-height:1.25}#stageName{font-size:1.85cqw;line-height:1.4;white-space:nowrap}#stagePrize{font-size:4.5cqw;line-height:1}#stagePrize img{width:4.5cqw;height:4.5cqw;object-fit:contain}

.mon.catching img{animation:none}.mon.catching .monster-art{animation:monsterCatch .52s cubic-bezier(.2,.8,.25,1) forwards}.mon:hover img{transform:none}.mon:hover .monster-art{transform:scale(1.04)}
#rewardIce img{display:block;width:22cqw;height:24cqw;object-fit:contain}
#message .txt{top:68%;font-size:3.6cqw}#resultDetail{font-size:3cqw}

[hidden]{display:none!important}

.boss-intro-copy{position:absolute;left:6%;top:23%;width:43%;z-index:1}
.boss-eyebrow{font-size:1.8cqw;letter-spacing:.08em;color:#e4c776}.boss-intro-copy h2{font-size:3.7cqw;margin:1cqw 0;line-height:1.3}.boss-intro-copy p{font-size:2.15cqw;line-height:1.8;margin:1cqw 0 3cqw}
.gold-button{border:2px solid #ffe09a;border-radius:18px;background:#ffcb65;color:#503816;font-family:inherit;font-weight:900;font-size:2.2cqw;padding:1.3cqw 2cqw;box-shadow:0 4px 0 #ad7e36;cursor:pointer}
@keyframes bossWelcome{from{opacity:0;transform:translateY(12%) scale(.8)}to{opacity:1;transform:none}}
#bossWin{background:radial-gradient(ellipse at 50% 45%,#6a7a38,#123d2c 77%);text-align:center;isolation:isolate}
#bossWin h2{position:absolute;top:3%;left:0;width:100%;font-size:5cqw;line-height:1.2;color:#ffe997;text-shadow:0 3px 0 #785222;margin:0;z-index:3}
.friend-glow{position:absolute;left:50%;top:43%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);background:repeating-conic-gradient(#ffe49644 0deg 12deg,transparent 12deg 30deg);mask-image:radial-gradient(circle,#000 10%,transparent 70%);animation:friendTurn 20s linear infinite}
.friend-hearts{position:absolute;top:23%;width:100%;font-size:7cqw;letter-spacing:10cqw;padding-left:10cqw;color:#ffa6a1;z-index:1;animation:heartFriend 2s ease-in-out infinite}
@keyframes heartFriend{50%{transform:translateY(-6%);filter:drop-shadow(0 0 10px #ffccb7)}}
.won-card{position:absolute;left:50%;top:17%;width:25%;height:47%;transform:translateX(-50%);border:4px solid #f6ce70;border-radius:16px;background:linear-gradient(145deg,#fff9d9,#f0d796);box-shadow:0 8px 30px #0005,0 0 25px #ffe99455;color:#4d361b;display:flex;flex-direction:column;align-items:center;padding:1cqw;z-index:2}
.won-card img{width:100%;height:78%;object-fit:contain}.won-card strong{font-size:2cqw}.card-ribbon{font-size:1cqw;letter-spacing:.16em;color:#7b662e}
#bossWin.arrived .won-card{animation:cardJoin .8s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes cardJoin{from{opacity:0;transform:translateX(-50%) translateY(25%) rotate(-8deg) scale(.5)}to{opacity:1;transform:translateX(-50%)}}
.boss-win-copy{position:absolute;top:66%;width:100%;z-index:3}.boss-win-copy p{font-size:2.1cqw;margin:0 0 .5cqw}.boss-win-copy strong{display:block;font-size:3.2cqw;color:#ffe392}.boss-win-copy small{display:block;font-size:1.5cqw;line-height:1.3;margin-top:.5cqw}#bossSaveStatus{font-size:1.2cqw}

@keyframes friendTurn{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}

#bossIntroText{white-space:pre-line}

#friendScene.glowing .friend-sun{opacity:1;transform:translate(-50%,-50%) scale(1)}
.friend-sparkles{position:absolute;top:37%;width:100%;font-size:6cqw;letter-spacing:11cqw;padding-left:11cqw;opacity:0;transition:opacity .6s;z-index:2;color:#ffbba5}
#friendScene.happy .friend-sparkles{opacity:1}#friendScene.forming .friend-sparkles{opacity:0}
#skipFriend{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);font:inherit;font-size:1.7cqw;color:#ffefc1;border:1px solid #e7d49a88;border-radius:20px;padding:.8cqw 1.6cqw;background:#183e2d;z-index:7;cursor:pointer}
@media(prefers-reduced-motion:reduce){.orbit-word{animation:none;transform:translate(-50%,-50%) rotate(var(--angle)) translateX(23cqw) rotate(calc(0deg - var(--angle)))}.friend-sun::after{animation:none}#friendScene *{transition:none!important}}


/* Character-sheet sprites retain each reference character's silhouette and belly placement. */
.atlas-sprite{position:absolute;background-repeat:no-repeat;pointer-events:none}
.monster-letter{width:auto;height:auto;min-width:1em;background:transparent;border-radius:0;transform:translate(-50%,-50%);font-family:'Arial Rounded MT Bold','Yu Gothic',sans-serif;font-weight:1000;text-shadow:0 1px 0 #fff5}
#steps{gap:3%}.step{flex:1 1 0;max-width:27%;font-size:3.2cqw}
#stageName{font-size:1.65cqw;white-space:nowrap}
#bossHud{left:46%;top:30%;width:25%;height:38%}
#friendScene{background:radial-gradient(ellipse at 50% 45%,#668576,var(--area-dark,#173e28) 75%)}
#game[data-area="ocean"] .boss-overlay,#game[data-area="snow"] .boss-overlay{background:var(--area-dark)}
#game[data-area="ocean"] #instruction,#game[data-area="snow"] #instruction{background:transparent}
@media(prefers-reduced-motion:reduce){.mon.catching .monster-art{animation:none}}

</style>
</head>
<body>
<nav id="gameToolbar" aria-label="ゲームメニュー"><span id="areaName">ジャングルエリア</span><button id="openBook" type="button">✦ カードずかん</button></nav>
<div id="game">
  <div id="bg"></div>
  <div id="stageSign"><div><div id="stageNumber"></div><div id="stageName"></div></div><div id="stagePrize" aria-hidden="true"></div></div>
  
  <div id="instruction" aria-live="polite"><span id="guideLead">まずは</span><span id="targetWord">「あ」</span><span id="guideEnd">をみつけよう！</span></div>
  <button id="repeatGuide" aria-label="もういちど きく"></button>
  <div id="steps" aria-label="あつめたもじ"></div>


  <div id="bossAmbient" aria-hidden="true"></div>
<div id="bossHud" hidden>
  <img id="bossPortrait" alt="">
</div>
<section id="bossIntro" class="boss-overlay" hidden aria-label="ボスとうじょう">
  <div class="boss-intro-copy"><span class="boss-eyebrow">ことばで なかよく なろう！</span><h2 id="bossIntroName"></h2><p id="bossIntroText"></p><button id="bossStart" class="gold-button" type="button">チャレンジ スタート！</button></div>
  <img id="bossIntroImage" alt="">
</section>
<section id="bossWin" class="boss-overlay" hidden aria-label="ボスクリア">
  <h2>ボスクリア！</h2>
  <div class="friend-glow" aria-hidden="true"></div>
  <div class="friend-hearts" aria-hidden="true">♥　✦　♥</div>
  <div class="won-card"><span class="card-ribbon">JUNGLE FRIEND</span><img id="bossWinImage" alt=""><strong id="bossCardName"></strong></div>
  <div class="boss-win-copy"><p id="bossFriendName"></p><strong id="bossCardNotice"></strong><small id="bossDuplicate"></small><small id="bossSaveStatus" role="status"></small></div>
  <div class="boss-win-actions"><button id="bossBook" class="gold-button" type="button">カードを みる</button><button id="bossContinue" class="gold-button" type="button">はじめから あそぶ</button></div>
</section>

<section id="friendScene" hidden aria-label="ボスが なかまになる えんしゅつ">
  <h2 id="friendCaption" aria-live="polite">ことばの ちからが あつまる…</h2>
  <div class="friend-sun" aria-hidden="true"></div>
  <div id="orbitWords" aria-hidden="true"></div>
  <div id="friendFigure">
    <img id="friendBefore" alt="">
    <img id="friendAfter" alt="">
    <strong id="friendCardLabel"></strong>
  </div>
  <div class="friend-sparkles" aria-hidden="true">✦　♥　✦</div>
  <button id="skipFriend" type="button">えんしゅつを スキップ</button>
</section>

<div id="foliageLayer" aria-hidden="true"></div>
<div id="monsterLayer"></div>
  <button id="restart" aria-label="やりなおす"></button>

  <div id="message" role="dialog" aria-label="あいすのできあがり">
    <div id="fusionLetters"></div>
    <div class="reward-halo" aria-hidden="true"></div>
    <div id="rewardIce" role="img" aria-label="アイス">🍦</div>
    <span class="reward-star" style="--sx:-18cqw;--sy:-12cqw" aria-hidden="true">✦</span>
    <span class="reward-star" style="--sx:18cqw;--sy:-10cqw" aria-hidden="true">✧</span>
    <span class="reward-star" style="--sx:-20cqw;--sy:8cqw" aria-hidden="true">✧</span>
    <span class="reward-star" style="--sx:20cqw;--sy:9cqw" aria-hidden="true">✦</span>
    <span class="reward-star" style="--sx:0cqw;--sy:-18cqw" aria-hidden="true">✦</span>
    <div class="txt"><span id="resultWord"></span><br><span id="resultDetail"></span></div>
    <div id="resultActions"><button id="nextStage" type="button">つぎのステージ ▶</button><button id="fromStart" type="button" hidden>はじめから あそぶ</button><button id="again" type="button">もういっかい！</button></div>
  </div>
</div>
<dialog id="cardBook" aria-labelledby="bookTitle">
  <div class="book-header"><div><small>なかまの コレクション</small><h2 id="bookTitle">カードずかん</h2></div><button id="bookClose" type="button" aria-label="ずかんを とじる">とじる ×</button></div>
  <button id="bookBack" type="button" hidden>← いちらんへ</button>
  <div id="bookList"><p id="bookCount"></p><div id="bookCards"></div><p class="book-hint">カードを タップして みてみよう！</p></div>
  <div id="cardDetail" hidden><div class="detail-art"><img id="detailImage" alt=""></div><div class="detail-copy"><h3 id="detailTitle"></h3><strong id="detailBoss"></strong><p id="detailArea"></p><p id="detailDescription"></p></div></div>
  <p id="bookSaveStatus" role="status"></p>
</dialog>

<script src="js/game-assets.js"></script>
<script src="js/word-data.js"></script>
<script src="js/world-data.js"></script>
<script src="js/stage-route.js"></script>
<script src="js/game-engine.js"></script>
</body>
</html>
