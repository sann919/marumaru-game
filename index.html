<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#17325b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>わくわくたしざんボール</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(16, 28, 63, .88);
      --line: rgba(255,255,255,.16);
      --text: #f8fbff;
      --muted: #c1d0ef;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, rgba(72,120,255,.35), transparent 28%),
        radial-gradient(circle at 85% 75%, rgba(255,135,83,.22), transparent 28%),
        linear-gradient(160deg, #091126, #18366c 62%, #1e1645);
      overscroll-behavior: none;
      touch-action: none;
    }
    #app {
      width: min(100vw, 760px);
      height: 100dvh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 8px;
      padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
    }
    header {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 8px;
    }
    .titlebox h1 { margin: 0; font-size: clamp(18px, 4vw, 28px); line-height: 1.05; }
    .titlebox p { margin: 3px 0 0; color: var(--muted); font-size: clamp(10px, 2.5vw, 13px); }
    .badge {
      min-width: 76px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 7px 20px rgba(0,0,0,.2);
      text-align: center;
    }
    .badge small { display: block; color: var(--muted); font-size: 10px; }
    .badge strong { display: block; font-size: clamp(17px, 3.8vw, 24px); line-height: 1.1; }
    #stageWrap {
      position: relative;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      background: rgba(2, 6, 22, .58);
      box-shadow: inset 0 0 50px rgba(65,100,255,.11), 0 14px 35px rgba(0,0,0,.25);
    }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #message {
      position: absolute;
      left: 50%; top: 42%;
      transform: translate(-50%, -50%) scale(.96);
      width: min(86%, 420px);
      padding: 20px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 20px;
      background: rgba(7, 12, 34, .93);
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: .18s ease;
    }
    #message.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
    #message h2 { margin: 0 0 8px; font-size: 27px; }
    #message p { margin: 5px 0 14px; color: var(--muted); }
    button {
      border: 0;
      border-radius: 16px;
      color: #111833;
      background: linear-gradient(#ffe886, #ffc83d);
      font: inherit;
      font-weight: 800;
      box-shadow: 0 5px 0 #bc8518, 0 9px 20px rgba(0,0,0,.25);
      cursor: pointer;
      user-select: none;
    }
    button:active { transform: translateY(3px); box-shadow: 0 2px 0 #bc8518; }
    #restart { padding: 12px 22px; }
    footer {
      display: grid;
      grid-template-columns: 1fr 1.35fr 1fr;
      gap: 9px;
      align-items: stretch;
    }
    .control { min-height: 56px; font-size: 24px; }
    #dropBtn { font-size: clamp(17px, 4.2vw, 22px); }
    #soundBtn { min-width: 58px; min-height: 52px; padding: 0 10px; font-size: 23px; }
    #help {
      position: absolute;
      right: 10px; bottom: 8px;
      color: rgba(255,255,255,.58);
      font-size: 11px;
      pointer-events: none;
      text-align: right;
    }
    @media (orientation: landscape) and (max-height: 650px) {
      #app { width: min(100vw, 980px); grid-template-columns: 180px 1fr 150px; grid-template-rows: 1fr; gap: 10px; }
      header { grid-template-columns: 1fr 1fr; align-content: start; }
      .titlebox { grid-column: 1 / -1; }
      footer { grid-template-columns: 1fr; align-content: center; }
      .control { min-height: 64px; }
    }
  </style>
</head>
<body>
  <main id="app">
    <header>
      <div class="titlebox">
        <h1>わくわくたしざんボール</h1>
        <p>同じ色 または 同じ数字でくっつくよ！ 30をこえたらポンっと消える！</p>
      </div>
      <div class="badge"><small>スコア</small><strong id="score">0</strong></div>
      <div class="badge"><small>ベスト</small><strong id="best">0</strong></div>
      <button id="soundBtn" aria-label="音のオンオフ" title="音のオンオフ">🔊</button>
    </header>

    <section id="stageWrap" aria-label="ゲーム画面">
      <canvas id="game"></canvas>
      <div id="message">
        <h2>ゲームオーバー</h2>
        <p id="resultText">スコア 0</p>
        <button id="restart">もう一度あそぶ</button>
      </div>
      <div id="help">指で位置を決めて離す<br>同じ色 or 同じ数字でくっつく！</div>
    </section>

    <footer>
      <button class="control" id="leftBtn" aria-label="左へ">◀</button>
      <button class="control" id="dropBtn">ここに落とす</button>
      <button class="control" id="rightBtn" aria-label="右へ">▶</button>
    </footer>
  </main>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('stageWrap');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const messageEl = document.getElementById('message');
  const resultText = document.getElementById('resultText');
  const restartBtn = document.getElementById('restart');
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');
  const dropBtn = document.getElementById('dropBtn');
  const soundBtn = document.getElementById('soundBtn');

  const COLORS = [
    { name: 'blue',   base: '#79c6ff', glow: '#d7efff', dark: '#214f73', cheek: '#bfdcff', deco: 'tear',   face: 'cry'     },
    { name: 'red',    base: '#ff8c8c', glow: '#ffdcdc', dark: '#742a2a', cheek: '#ffc0c0', deco: 'horn',   face: 'angry'   },
    { name: 'green',  base: '#7fe08f', glow: '#defbe1', dark: '#285236', cheek: '#ffd8d0', deco: 'leaf',   face: 'happy'   },
    { name: 'yellow', base: '#ffd166', glow: '#fff0c6', dark: '#6a4f14', cheek: '#ffd2bf', deco: 'crown',  face: 'laugh'   },
    { name: 'purple', base: '#b39dff', glow: '#ece3ff', dark: '#43326f', cheek: '#ffd3ea', deco: 'star',   face: 'puzzle'  }
  ];

  let W = 400, H = 640, dpr = 1;
  let balls = [];
  let particles = [];
  let nextId = 1;
  let currentSpawn = null;
  let nextSpawn = null;
  let aimX = W / 2;
  let canDrop = true;
  let cooldown = 0;
  let score = 0;
  let best = loadBest();
  let gameOver = false;
  let dangerTime = 0;
  let pointerActive = false;
  let lastTime = performance.now();
  let accumulator = 0;

  const GRAVITY = 1080;
  const RESTITUTION = 0.18;
  const FRICTION = 0.986;
  const FIXED_DT = 1 / 60;
  const DANGER_Y = 145;
  const DROP_Y = 44;
  const SIZE_MULT = 2.2;

  let audioCtx = null;
  let masterGain = null;
  let musicGain = null;
  let sfxGain = null;
  let musicTimer = null;
  let nextNoteTime = 0;
  let melodyStep = 0;
  let audioEnabled = true;

  const MELODY = [
    523.25, 659.25, 783.99, 659.25,
    587.33, 698.46, 880.00, 698.46,
    493.88, 587.33, 739.99, 587.33,
    523.25, 659.25, 783.99, 1046.50
  ];

  bestEl.textContent = String(best);
  updateSoundButton();

  function updateSoundButton() {
    soundBtn.textContent = audioEnabled ? '🔊' : '🔇';
    soundBtn.setAttribute('aria-label', audioEnabled ? '音を消す' : '音を出す');
  }

  function initAudio() {
    if (audioCtx) return;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) {
      audioEnabled = false;
      updateSoundButton();
      soundBtn.disabled = true;
      return;
    }
    audioCtx = new AudioContextClass();
    masterGain = audioCtx.createGain();
    musicGain = audioCtx.createGain();
    sfxGain = audioCtx.createGain();
    masterGain.gain.value = audioEnabled ? 0.8 : 0;
    musicGain.gain.value = 0.13;
    sfxGain.gain.value = 0.34;
    musicGain.connect(masterGain);
    sfxGain.connect(masterGain);
    masterGain.connect(audioCtx.destination);
  }

  function ensureAudio() {
    if (!audioEnabled) return;
    initAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    if (!musicTimer) startMusic();
  }

  function startMusic() {
    if (!audioCtx || musicTimer) return;
    nextNoteTime = audioCtx.currentTime + 0.06;
    melodyStep = 0;
    scheduleMusic();
    musicTimer = setInterval(scheduleMusic, 120);
  }

  function scheduleMusic() {
    if (!audioCtx || !audioEnabled) return;
    const lookAhead = audioCtx.currentTime + 0.45;
    while (nextNoteTime < lookAhead) {
      const frequency = MELODY[melodyStep % MELODY.length];
      playMusicNote(frequency, nextNoteTime, 0.20, melodyStep % 4 === 0 ? 0.050 : 0.038);
      if (melodyStep % 4 === 0) playMusicNote(frequency / 2, nextNoteTime, 0.30, 0.024);
      melodyStep++;
      nextNoteTime += 0.27;
    }
  }

  function playMusicNote(frequency, start, duration, volume) {
    if (!audioCtx || !musicGain) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(frequency, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(volume, start + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain);
    gain.connect(musicGain);
    osc.start(start);
    osc.stop(start + duration + 0.03);
  }

  function playTone(frequency, duration = 0.12, volume = 0.22, type = 'sine', delay = 0) {
    if (!audioEnabled) return;
    ensureAudio();
    if (!audioCtx || !sfxGain) return;
    const start = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(frequency, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(volume, start + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain);
    gain.connect(sfxGain);
    osc.start(start);
    osc.stop(start + duration + 0.03);
  }

  function playSfx(kind) {
    if (!audioEnabled) return;
    switch (kind) {
      case 'drop':
        playTone(330, 0.09, 0.16, 'sine');
        playTone(260, 0.10, 0.11, 'triangle', 0.055);
        break;
      case 'merge':
        playTone(523.25, 0.10, 0.20, 'sine');
        playTone(659.25, 0.12, 0.20, 'sine', 0.07);
        break;
      case 'clear':
        playTone(783.99, 0.10, 0.22, 'square');
        playTone(1046.50, 0.13, 0.20, 'triangle', 0.06);
        playTone(1318.51, 0.16, 0.18, 'sine', 0.13);
        break;
      case 'gameover':
        playTone(392.00, 0.18, 0.18, 'triangle');
        playTone(329.63, 0.20, 0.18, 'triangle', 0.14);
        playTone(261.63, 0.28, 0.18, 'triangle', 0.30);
        break;
      case 'restart':
        playTone(523.25, 0.08, 0.16, 'sine');
        playTone(783.99, 0.12, 0.16, 'sine', 0.07);
        break;
    }
  }


  function loadBest() {
    try { return Number(localStorage.getItem('wakuwaku_add_best') || 0); } catch (_) { return 0; }
  }
  function saveBest(value) {
    try { localStorage.setItem('wakuwaku_add_best', String(value)); } catch (_) {}
  }

  function resize() {
    const rect = wrap.getBoundingClientRect();
    W = Math.max(280, rect.width);
    H = Math.max(360, rect.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const b of balls) b.r = valueRadius(b.value);
    const currentR = currentSpawn ? valueRadius(currentSpawn.value) : 18;
    aimX = clamp(aimX, currentR + 4, W - currentR - 4);
  }

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function valueRadius(value) {
    const scale = clamp(W / 400, .82, 1.16);
    return (14 + Math.pow(value, 0.58) * 6.1) * scale * SIZE_MULT;
  }

  function randomSpawn() {
    return {
      value: 1 + Math.floor(Math.random() * 9),
      colorIndex: Math.floor(Math.random() * COLORS.length)
    };
  }

  function resetGame() {
    balls = [];
    particles = [];
    nextId = 1;
    score = 0;
    scoreEl.textContent = '0';
    currentSpawn = randomSpawn();
    nextSpawn = randomSpawn();
    aimX = W / 2;
    canDrop = true;
    cooldown = 0;
    gameOver = false;
    dangerTime = 0;
    messageEl.classList.remove('show');
  }

  function addBall(x, y, value, colorIndex, vx = 0, vy = 0) {
    balls.push({
      id: nextId++, x, y, vx, vy, value, colorIndex,
      r: valueRadius(value), age: 0, merging: false,
      squash: 0, angle: Math.random() * Math.PI * 2
    });
  }

  function drop() {
    if (!canDrop || gameOver || !currentSpawn) return;
    const r = valueRadius(currentSpawn.value);
    aimX = clamp(aimX, r + 3, W - r - 3);
    ensureAudio();
    addBall(aimX, DROP_Y + r, currentSpawn.value, currentSpawn.colorIndex, 0, 10);
    playSfx('drop');
    currentSpawn = nextSpawn;
    nextSpawn = randomSpawn();
    canDrop = false;
    cooldown = .54;
  }

  function canMerge(a, b) {
    return a.value === b.value || a.colorIndex === b.colorIndex;
  }

  function mergePair(a, b) {
    if (a.merging || b.merging || !canMerge(a, b)) return false;

    a.merging = b.merging = true;
    const newValue = a.value + b.value;
    const totalMass = a.r * a.r + b.r * b.r;
    const x = (a.x * a.r * a.r + b.x * b.r * b.r) / totalMass;
    const y = (a.y * a.r * a.r + b.y * b.r * b.r) / totalMass;
    const vx = (a.vx + b.vx) * .35;
    const vy = Math.min((a.vy + b.vy) * .24 - 60, 110);
    const colorIndex = a.colorIndex === b.colorIndex ? a.colorIndex : (a.id < b.id ? a.colorIndex : b.colorIndex);

    balls = balls.filter(o => o !== a && o !== b);
    score += newValue;
    scoreEl.textContent = String(score);
    if (score > best) {
      best = score;
      bestEl.textContent = String(best);
      saveBest(best);
    }

    burst(x, y, COLORS[colorIndex].base, 14 + Math.min(24, Math.round(newValue / 4)));

    if (newValue > 30) {
      burst(x, y, '#ffffff', 36);
      floatingText(x, y, '30こえた！', '#fff4a0');
      playSfx('clear');
      return true;
    }

    addBall(x, y, newValue, colorIndex, vx, vy);
    const newborn = balls[balls.length - 1];
    newborn.squash = .32;
    newborn.age = 0.03;
    floatingText(x, y, `${a.value}+${b.value}=${newValue}`, '#ffffff');
    playSfx('merge');
    return true;
  }

  function resolveCollision(a, b) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const minDist = a.r + b.r;
    const distSq = dx * dx + dy * dy;
    if (distSq >= minDist * minDist || distSq === 0) return false;
    const dist = Math.sqrt(distSq);
    const nx = dx / dist;
    const ny = dy / dist;
    const overlap = minDist - dist;

    if (canMerge(a, b) && a.age > .02 && b.age > .02) {
      return mergePair(a, b);
    }

    const ma = a.r * a.r;
    const mb = b.r * b.r;
    const invTotal = 1 / (ma + mb);
    a.x -= nx * overlap * mb * invTotal;
    a.y -= ny * overlap * mb * invTotal;
    b.x += nx * overlap * ma * invTotal;
    b.y += ny * overlap * ma * invTotal;

    const rvx = b.vx - a.vx;
    const rvy = b.vy - a.vy;
    const velAlongNormal = rvx * nx + rvy * ny;
    if (velAlongNormal < 0) {
      const invMa = 1 / ma;
      const invMb = 1 / mb;
      const j = -(1 + RESTITUTION) * velAlongNormal / (invMa + invMb);
      const ix = j * nx;
      const iy = j * ny;
      a.vx -= ix * invMa;
      a.vy -= iy * invMa;
      b.vx += ix * invMb;
      b.vy += iy * invMb;
    }
    a.squash = Math.min(.12, Math.abs(velAlongNormal) / 1600);
    b.squash = Math.min(.12, Math.abs(velAlongNormal) / 1600);
    return false;
  }

  function step(dt) {
    if (gameOver) {
      updateParticles(dt);
      return;
    }

    cooldown -= dt;
    if (!canDrop && cooldown <= 0) canDrop = true;

    for (const b of balls) {
      b.age += dt;
      b.vy += GRAVITY * dt;
      b.vx *= Math.pow(FRICTION, dt * 60);
      b.vy *= Math.pow(.999, dt * 60);
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.squash *= Math.pow(.13, dt);
      b.angle += b.vx * dt * 0.002;

      if (b.x - b.r < 0) {
        b.x = b.r;
        b.vx = Math.abs(b.vx) * RESTITUTION;
      } else if (b.x + b.r > W) {
        b.x = W - b.r;
        b.vx = -Math.abs(b.vx) * RESTITUTION;
      }
      if (b.y + b.r > H) {
        const hit = Math.abs(b.vy);
        b.y = H - b.r;
        b.vy = -hit * RESTITUTION;
        b.vx *= .94;
        if (hit < 45) b.vy = 0;
        b.squash = Math.min(.16, hit / 1100);
      }
    }

    let merged = true;
    let safety = 0;
    while (merged && safety < Math.max(8, balls.length * 2)) {
      merged = false;
      outer:
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          if (resolveCollision(balls[i], balls[j])) {
            merged = true;
            break outer;
          }
        }
      }
      safety++;
    }

    // 追加の衝突解決で、めり込みや横押しを安定化
    for (let pass = 0; pass < 3; pass++) {
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          resolveCollision(balls[i], balls[j]);
        }
      }
    }

    const inDanger = balls.some(b => b.age > 0.65 && b.y - b.r < DANGER_Y && Math.abs(b.vy) < 150);
    dangerTime = inDanger ? dangerTime + dt : Math.max(0, dangerTime - dt * 0.8);
    if (dangerTime > 1.0) endGame();

    updateParticles(dt);
  }

  function endGame() {
    gameOver = true;
    playSfx('gameover');
    resultText.textContent = `スコア ${score}　／　ベスト ${best}`;
    messageEl.classList.add('show');
  }

  function burst(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 45 + Math.random() * 190;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 35, life: .55 + Math.random() * .45, max: 1, size: 2 + Math.random() * 5, color, kind: 'dot' });
    }
  }

  function floatingText(x, y, text, color) {
    particles.push({ x, y: y - 8, vx: 0, vy: -25, life: .9, max: .9, size: 0, color, kind: 'text', text });
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.life -= dt;
      p.vy += p.kind === 'dot' ? 420 * dt : 0;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function drawCharacter(b, alpha = 1) {
    const theme = COLORS[b.colorIndex];
    const squashX = 1 + b.squash;
    const squashY = 1 - b.squash;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.sin(b.angle + b.age) * .03);

    drawAccessory(theme, b.r);

    ctx.scale(squashX, squashY);
    const g = ctx.createRadialGradient(-b.r * .34, -b.r * .40, b.r * .08, 0, 0, b.r);
    g.addColorStop(0, theme.glow);
    g.addColorStop(.35, theme.base);
    g.addColorStop(1, shade(theme.base, -.26));
    ctx.fillStyle = g;
    ctx.shadowColor = theme.base;
    ctx.shadowBlur = Math.max(6, b.r * .2);
    ctx.beginPath();
    ctx.arc(0, 0, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = 'rgba(255,255,255,.48)';
    ctx.lineWidth = Math.max(1.2, b.r * .045);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,.20)';
    ctx.beginPath();
    ctx.ellipse(-b.r * .26, -b.r * .34, b.r * .19, b.r * .11, -0.75, 0, Math.PI * 2);
    ctx.fill();

    const labelW = Math.max(b.r * 1.40, 38);
    const labelH = Math.max(b.r * .46, 22);
    const labelY = -b.r * .91;
    ctx.fillStyle = 'rgba(255,255,255,.96)';
    roundRect(ctx, -labelW / 2, labelY, labelW, labelH, labelH / 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.68)';
    ctx.lineWidth = Math.max(1, b.r * .018);
    ctx.stroke();

    ctx.fillStyle = theme.dark;
    const digits = String(b.value).length;
    const fontSize = digits >= 3 ? b.r * .34 : digits === 2 ? b.r * .43 : b.r * .54;
    ctx.font = `900 ${fontSize}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(b.value), 0, labelY + labelH * .53);

    drawFace(theme, b.r);
    ctx.restore();
  }

  function drawFace(theme, r) {
    const dark = theme.dark;
    ctx.lineCap = 'round';

    switch (theme.face) {
      case 'cry': {
        const eyeY = -r * .02;
        const eyeX = r * .25;
        ctx.strokeStyle = dark;
        ctx.lineWidth = Math.max(2, r * .045);
        ctx.beginPath();
        ctx.arc(-eyeX, eyeY, r * .10, .18, Math.PI - .18);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(eyeX, eyeY, r * .10, .18, Math.PI - .18);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, r * .26, r * .15, Math.PI + .25, Math.PI * 2 - .25);
        ctx.stroke();
        ctx.fillStyle = 'rgba(150,220,255,.95)';
        ctx.beginPath(); ctx.ellipse(-eyeX + r * .02, eyeY + r * .14, r * .05, r * .10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(eyeX + r * .02, eyeY + r * .14, r * .05, r * .10, 0, 0, Math.PI * 2); ctx.fill();
        break;
      }
      case 'angry': {
        const eyeY = -r * .02;
        const eyeX = r * .25;
        ctx.strokeStyle = dark;
        ctx.lineWidth = Math.max(2, r * .045);
        ctx.beginPath(); ctx.moveTo(-eyeX - r * .08, eyeY - r * .12); ctx.lineTo(-eyeX + r * .08, eyeY - r * .02); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(eyeX - r * .08, eyeY - r * .02); ctx.lineTo(eyeX + r * .08, eyeY - r * .12); ctx.stroke();
        ctx.fillStyle = dark;
        ctx.beginPath(); ctx.arc(-eyeX, eyeY + r * .02, r * .045, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(eyeX, eyeY + r * .02, r * .045, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.arc(0, r * .33, r * .13, Math.PI + .15, Math.PI * 2 - .15);
        ctx.stroke();
        break;
      }
      case 'happy': {
        const eyeY = -r * .02;
        const eyeX = r * .23;
        ctx.strokeStyle = dark;
        ctx.lineWidth = Math.max(2, r * .045);
        ctx.beginPath();
        ctx.arc(-eyeX, eyeY, r * .08, .15, Math.PI - .15);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(eyeX, eyeY, r * .08, .15, Math.PI - .15);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, r * .16, r * .20, .12, Math.PI - .12);
        ctx.stroke();
        break;
      }
      case 'laugh': {
        const eyeY = -r * .04;
        const eyeX = r * .25;
        ctx.strokeStyle = dark;
        ctx.lineWidth = Math.max(2, r * .05);
        ctx.beginPath(); ctx.moveTo(-eyeX - r * .07, eyeY); ctx.lineTo(-eyeX + r * .07, eyeY + r * .07); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(eyeX - r * .07, eyeY + r * .07); ctx.lineTo(eyeX + r * .07, eyeY); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.92)';
        ctx.beginPath();
        ctx.arc(0, r * .20, r * .20, 0, Math.PI);
        ctx.fill();
        ctx.strokeStyle = dark;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,128,128,.75)';
        ctx.beginPath();
        ctx.arc(0, r * .27, r * .10, 0, Math.PI);
        ctx.fill();
        break;
      }
      case 'puzzle': {
        const eyeY = -r * .01;
        const eyeX = r * .24;
        ctx.strokeStyle = dark;
        ctx.lineWidth = Math.max(2, r * .043);
        ctx.beginPath(); ctx.moveTo(-eyeX - r * .06, eyeY - r * .09); ctx.lineTo(-eyeX + r * .08, eyeY - r * .11); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(eyeX - r * .06, eyeY - r * .13); ctx.lineTo(eyeX + r * .08, eyeY - r * .03); ctx.stroke();
        ctx.fillStyle = dark;
        ctx.beginPath(); ctx.arc(-eyeX, eyeY + r * .02, r * .043, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(eyeX, eyeY, r * .043, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, r * .21, r * .07, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.75)';
        ctx.lineWidth = Math.max(1.3, r * .03);
        ctx.beginPath();
        ctx.moveTo(r * .30, -r * .24);
        ctx.lineTo(r * .40, -r * .34);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.82)';
        ctx.font = `bold ${r * .25}px system-ui`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', r * .44, -r * .40);
        break;
      }
    }
  }

  function drawAccessory(theme, r) {
    ctx.save();
    ctx.fillStyle = shade(theme.base, .08);
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = Math.max(1, r * .03);
    switch (theme.deco) {
      case 'tear':
        ctx.fillStyle = 'rgba(255,255,255,.35)';
        ctx.beginPath();
        ctx.ellipse(0, -r * .83, r * .10, r * .16, 0, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'horn':
        ctx.fillStyle = 'rgba(255,255,255,.24)';
        ctx.beginPath();
        ctx.moveTo(-r * .30, -r * .54); ctx.lineTo(-r * .18, -r * .86); ctx.lineTo(-r * .03, -r * .50); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(r * .30, -r * .54); ctx.lineTo(r * .18, -r * .86); ctx.lineTo(r * .03, -r * .50); ctx.closePath();
        ctx.fill(); ctx.stroke();
        break;
      case 'leaf':
        ctx.beginPath(); ctx.ellipse(0, -r * .81, r * .14, r * .25, -.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -r * .60); ctx.lineTo(0, -r * .34); ctx.stroke();
        break;
      case 'crown':
        ctx.beginPath();
        ctx.moveTo(-r * .33, -r * .55); ctx.lineTo(-r * .22, -r * .88); ctx.lineTo(0, -r * .60); ctx.lineTo(r * .22, -r * .88); ctx.lineTo(r * .33, -r * .55); ctx.closePath();
        ctx.fill(); ctx.stroke();
        break;
      case 'star':
        drawStar(0, -r * .79, r * .16, r * .07, 5);
        ctx.fill(); ctx.stroke();
        break;
    }
    ctx.restore();
  }

  function drawStar(cx, cy, outerR, innerR, points) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const a = -Math.PI / 2 + i * Math.PI / points;
      const rr = i % 2 === 0 ? outerR : innerR;
      const x = cx + Math.cos(a) * rr;
      const y = cy + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function shade(hex, amount) {
    const n = parseInt(hex.slice(1), 16);
    const r = clamp((n >> 16) + Math.round(255 * amount), 0, 255);
    const g = clamp(((n >> 8) & 255) + Math.round(255 * amount), 0, 255);
    const b = clamp((n & 255) + Math.round(255 * amount), 0, 255);
    return `rgb(${r},${g},${b})`;
  }

  function drawBackground() {
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,.34)';
    for (let i = 0; i < 35; i++) {
      const x = ((i * 83.17) % W);
      const y = ((i * 47.31 + 23) % H);
      const s = (i % 3 === 0) ? 1.5 : .8;
      ctx.fillRect(x, y, s, s);
    }

    const warning = clamp(dangerTime / 1.0, 0, 1);
    ctx.save();
    ctx.setLineDash([8, 8]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = `rgba(255, ${Math.round(185 - warning * 120)}, ${Math.round(130 - warning * 80)}, ${.35 + warning * .6})`;
    ctx.beginPath(); ctx.moveTo(0, DANGER_Y); ctx.lineTo(W, DANGER_Y); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = `rgba(255,220,180,${.35 + warning * .6})`;
    ctx.font = 'bold 11px system-ui';
    ctx.fillText(warning > .2 ? 'あぶない！' : 'ここを越え続けると終了', 9, DANGER_Y - 8);
  }

  function drawPreview() {
    if (gameOver || !currentSpawn) return;
    const r = valueRadius(currentSpawn.value);
    aimX = clamp(aimX, r + 3, W - r - 3);
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.16)';
    ctx.setLineDash([4, 7]);
    ctx.beginPath(); ctx.moveTo(aimX, DROP_Y + r * 2); ctx.lineTo(aimX, H); ctx.stroke();
    ctx.restore();
    drawCharacter({ x: aimX, y: DROP_Y + r, r, value: currentSpawn.value, colorIndex: currentSpawn.colorIndex, squash: 0, angle: 0, age: 0 }, canDrop ? .92 : .40);

    if (!nextSpawn) return;
    const nr = Math.min(28, valueRadius(nextSpawn.value) * .40);
    ctx.save();
    ctx.fillStyle = 'rgba(4,8,24,.72)';
    ctx.strokeStyle = 'rgba(255,255,255,.18)';
    ctx.lineWidth = 1;
    roundRect(ctx, W - 104, 10, 94, 78, 13);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.76)';
    ctx.font = '10px system-ui';
    ctx.fillText('つぎ', W - 92, 23);
    drawCharacter({ x: W - 57, y: 50, r: nr, value: nextSpawn.value, colorIndex: nextSpawn.colorIndex, squash: 0, angle: 0, age: 0 }, 1);
    ctx.restore();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function render() {
    drawBackground();
    for (const b of balls) drawCharacter(b);
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      if (p.kind === 'text') {
        ctx.fillStyle = p.color;
        ctx.font = 'bold 14px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.text, p.x, p.y);
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    drawPreview();
  }

  function frame(now) {
    const dt = Math.min(.04, (now - lastTime) / 1000);
    lastTime = now;
    accumulator += dt;
    while (accumulator >= FIXED_DT) {
      step(FIXED_DT);
      accumulator -= FIXED_DT;
    }
    render();
    requestAnimationFrame(frame);
  }

  function pointX(ev) {
    const rect = canvas.getBoundingClientRect();
    return (ev.clientX - rect.left) * (W / rect.width);
  }

  canvas.addEventListener('pointerdown', ev => {
    ensureAudio();
    if (gameOver || !currentSpawn) return;
    pointerActive = true;
    canvas.setPointerCapture?.(ev.pointerId);
    const r = valueRadius(currentSpawn.value);
    aimX = clamp(pointX(ev), r + 3, W - r - 3);
  });
  canvas.addEventListener('pointermove', ev => {
    if (!pointerActive || gameOver || !currentSpawn) return;
    const r = valueRadius(currentSpawn.value);
    aimX = clamp(pointX(ev), r + 3, W - r - 3);
  });
  canvas.addEventListener('pointerup', () => {
    if (!pointerActive) return;
    pointerActive = false;
    drop();
  });
  canvas.addEventListener('pointercancel', () => { pointerActive = false; });

  function moveAim(dir) {
    if (gameOver || !currentSpawn) return;
    const r = valueRadius(currentSpawn.value);
    aimX = clamp(aimX + dir * Math.max(18, W * .055), r + 3, W - r - 3);
  }
  leftBtn.addEventListener('click', () => { ensureAudio(); moveAim(-1); });
  rightBtn.addEventListener('click', () => { ensureAudio(); moveAim(1); });
  dropBtn.addEventListener('click', () => { ensureAudio(); drop(); });
  restartBtn.addEventListener('click', () => { ensureAudio(); playSfx('restart'); resetGame(); });
  soundBtn.addEventListener('click', () => {
    initAudio();
    audioEnabled = !audioEnabled;
    updateSoundButton();
    if (!audioCtx || !masterGain) return;
    if (audioEnabled) {
      audioCtx.resume().catch(() => {});
      nextNoteTime = audioCtx.currentTime + 0.06;
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setTargetAtTime(0.8, audioCtx.currentTime, 0.03);
      if (!musicTimer) startMusic();
      playSfx('restart');
    } else {
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.03);
    }
  });

  window.addEventListener('keydown', ev => {
    ensureAudio();
    if (ev.key === 'ArrowLeft') moveAim(-1);
    if (ev.key === 'ArrowRight') moveAim(1);
    if (ev.key === ' ' || ev.key === 'ArrowDown' || ev.key === 'Enter') { ev.preventDefault(); drop(); }
    if (ev.key.toLowerCase() === 'r') resetGame();
  });
  window.addEventListener('resize', resize);
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(wrap);

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  resize();
  resetGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
